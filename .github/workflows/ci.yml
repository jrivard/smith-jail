name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.1"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Cross-compile check (darwin)
        run: |
          for arch in amd64 arm64; do
            echo "== GOOS=darwin GOARCH=$arch =="
            GOOS=darwin GOARCH=$arch go build -o /dev/null .
            GOOS=darwin GOARCH=$arch go vet ./...
          done

      - name: Gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'd:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Integration test (filesystem jail)
        run: go test -tags=integration -v -run TestFilesystemJail ./...
